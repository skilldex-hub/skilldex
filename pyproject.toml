[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilldex"
version = "0.1.1"
description = "Search, install, validate, and audit Claude Code skills, subagents, and MCP servers from a community registry."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Cecko", email = "ceckodavid@gmail.com" }]
keywords = ["claude", "claude-code", "skills", "subagents", "mcp", "registry", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
skilldex = "skilldex.cli:app"

[project.urls]
Homepage = "https://github.com/skilldex-hub/skilldex"
Registry = "https://github.com/skilldex-hub/skilldex-hub.github.io"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
